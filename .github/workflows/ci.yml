name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from the packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      # Ollama-dependent integration tests skip themselves when no daemon is
      # reachable; the live Hugging Face ingest test additionally requires
      # WT_TEST_HF=1. CI runs the pure suites.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: CLI smoke (built artifact)
        run: node packages/cli/dist/index.js --help
